# UpscaleAI frontend on Netlify (static build only).
# The Express API + Python Real-ESRGAN worker CANNOT run on Netlify
# (function timeouts + RAM limits); they need a real server host.
# Set VITE_API_URL in the Netlify dashboard to the API host URL once it
# exists; without it the built app calls same-origin /api (local dev only).
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

# API calls must NEVER receive the SPA fallback: previously /api/auth/me
# returned index.html (200), which the app parsed into a fake logged-in
# user. This rule runs first (Netlify processes redirects in order) and
# answers API calls with a real 404 + a static JSON explanation.
[[redirects]]
  from = "/api/*"
  to = "/api-offline.json"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
